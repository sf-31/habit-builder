# Publishes both versions of the site together:
#   main branch -> https://<user>.github.io/habit-builder/
#   test branch -> https://<user>.github.io/habit-builder/test/
# A push to either branch rebuilds both. If there's no test branch yet,
# /test/ serves a copy of main.
name: Deploy

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs the tests on the branch that was pushed. A failure stops the deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Check out test
        id: test
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: test
          path: test

      # Adds ?v=<commit> to every local .js/.css URL (script/link tags and
      # module imports), so each deploy gets new URLs and browsers never mix
      # cached files from an older deploy with new ones.
      - name: Version asset URLs
        run: |
          for dir in main test; do
            [ -d "$dir/app" ] || continue
            v=$(git -C "$dir" rev-parse --short HEAD)
            find "$dir/app" -name '*.html' -exec sed -i -E \
              "s#((src|href)=\"[^\":]*\.(js|css))\"#\1?v=$v\"#g" {} +
            find "$dir/app" -name '*.js' -exec sed -i -E \
              "s#(from '\.[^']*\.js)'#\1?v=$v'#g" {} +
          done

      - name: Assemble site
        run: |
          mkdir -p _site/test
          cp -R main/app/. _site/
          if [ -d test/app ]; then
            cp -R test/app/. _site/test/
          else
            cp -R main/app/. _site/test/
          fi
          # Keep the test build out of search results.
          sed -i 's|<meta charset="utf-8">|<meta charset="utf-8">\n  <meta name="robots" content="noindex, nofollow">|' _site/test/index.html
          printf 'User-agent: *\nDisallow: /habit-builder/test/\nDisallow: /test/\n' > _site/robots.txt
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
